<style>
  @font-face {
    font-family: 'Inter';
    src: url('inter-variable.woff2') format('woff2');
    font-weight: 400 500; font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'Inter', "Helvetica Neue", Arial, sans-serif;
    font-weight: 435;
    -webkit-font-smoothing: antialiased;
    background: #fff; color: #000;
    overflow: hidden;
  }

  .markwrap {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .mark {
    display: flex;
    font-size: 21.65px; line-height: 1; letter-spacing: 0;
    font-weight: 410;

    transform: scaleX(1.0326);
    text-transform: uppercase; white-space: nowrap;
  }
  .mark span {
    display: inline-block;
    transition: transform 0.38s cubic-bezier(0.45, 0, 0.55, 1);
    will-change: transform;
  }

  .regel {
    position: fixed; left: 0; right: 0;
    text-align: center;
    font-size: 13.75px; letter-spacing: 0.017em; line-height: 1.6;
    padding: 0 40px;
    visibility: hidden;
    will-change: transform;

    transition: transform 0.25s cubic-bezier(0.45, 0, 0.55, 1),
                visibility 0s 0.25s;
  }
  .regel a { color: #000; text-decoration: none; }

  #regelboven .zweef { display: none; }
  #regelboven a:hover .rust { display: none; }
  #regelboven a:hover .zweef { display: inline; }

  #regelboven { top: 40px; transform: translateY(calc(-100% - 41px)); }
  #regelonder { bottom: 40px; transform: translateY(calc(100% + 41px)); }
  .regel.aan {
    visibility: visible;
    transition: transform 0.25s cubic-bezier(0.45, 0, 0.55, 1);
  }

  #regelboven.aan { transform: translateY(0); }
  #regelonder.aan { transform: translateY(0); }
  @media (max-width: 639px) {
    .regel { padding: 0 34px; }
    #regelboven { top: 34px; }
    #regelonder { bottom: 34px; }
  }
</style>

<body>

  <div class="markwrap">
    <div class="mark" id="mark"><span id="now">NOW</span><span id="new">NEW</span></div>
  </div>

  <div class="regel" id="regelboven"><a href="mailto:info@nownewgroup.com"><span class="rust">Contact</span><span class="zweef">E-mail</span></a></div>
  <div class="regel" id="regelonder">NOWNEW is registered under KvK 67855407 with VAT NL002277924B95, NOWNEW B.V. under KvK 81255403 with VAT NL862020736B01</div>

  <script>
    history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);

    var body = document.body,
        now  = document.getElementById('now'),
        neu  = document.getElementById('new'),
        M    = 40,
        played = false;

    var SCHAAL = 1.0326;

    function layout() {
      var w = document.documentElement.clientWidth;
      if (w < 640) return { mode: 'S' };
      return { mode: 'L' };
    }
    var L = layout();

    var ankerNow = null, ankerNew = null;
    function zetAnkers(rond) {
      now.style.transform = ''; neu.style.transform = '';
      var a = now.getBoundingClientRect(),
          b = neu.getBoundingClientRect(),
          vw = window.innerWidth,
          mx = (L.mode === 'S') ? 34 : M;
      if (rond || ankerNow === null) {
        var tn = Math.round((mx - a.left) / SCHAAL),
            tw = Math.round(((vw - mx) - b.right) / SCHAAL);
        ankerNow = a.left + tn * SCHAAL;
        ankerNew = b.right + tw * SCHAAL;
        now.style.transform = 'translateX(' + tn.toFixed(2) + 'px)';
        neu.style.transform = 'translateX(' + tw.toFixed(2) + 'px)';
      } else {
        now.style.transform = 'translateX(' + ((ankerNow - a.left) / SCHAAL).toFixed(2) + 'px)';
        neu.style.transform = 'translateX(' + ((ankerNew - b.right) / SCHAAL).toFixed(2) + 'px)';
      }
    }
    function zetMerk() { zetAnkers(true); }

    function play(delta) {
      if (played) return;
      played = true;
      zetMerk();
      body.classList.add('opened');
      setTimeout(function () {
        if (delta < 0) toonBoven(); else toonOnder();
      }, 120);
      setTimeout(function () { splitsKlaar = true; }, 420);
    }

    var infoBoven = false, infoOnder = false,
        bovenGezien = false, onderGezien = false,
        stilTot = 0;
    function toonOnder() {
      infoOnder = true; onderGezien = true;
      document.getElementById('regelonder').classList.add('aan');
      if (infoBoven) { infoBoven = false; document.getElementById('regelboven').classList.remove('aan'); }
    }
    function toonBoven() {
      infoBoven = true; bovenGezien = true;
      document.getElementById('regelboven').classList.add('aan');
      if (infoOnder) { infoOnder = false; document.getElementById('regelonder').classList.remove('aan'); }
    }
    var splitsKlaar = false;

    function duw(delta) {
      if (!played) { play(delta); return; }
      if (!splitsKlaar) return;
      var nuFase = performance.now();
      if (nuFase < stilTot) return;
      if (delta > 0 && !infoOnder) {
        toonOnder();
        stilTot = nuFase + 350;
        return;
      }
      if (delta < 0 && !infoBoven) {
        toonBoven();
        stilTot = nuFase + 350;
        return;
      }
    }

    window.addEventListener('wheel', function (e) {
      duw(e.deltaY);
    }, { passive: true });

    var touchVorigY = null;
    window.addEventListener('touchstart', function (e) {
      touchVorigY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchmove', function (e) {
      if (e.cancelable) e.preventDefault();
      var y = e.touches[0].clientY;
      var dy = (touchVorigY === null) ? 1 : touchVorigY - y;
      touchVorigY = y;
      duw(dy * 2.5);
    }, { passive: false });
    window.addEventListener('touchend', function () { touchVorigY = null; }, { passive: true });

    window.addEventListener('keydown', function (e) {
      var omlaag = [' ', 'ArrowDown', 'PageDown'].indexOf(e.key) >= 0,
          omhoog = ['ArrowUp', 'PageUp'].indexOf(e.key) >= 0;
      if (!omlaag && !omhoog) return;
      if (e.cancelable) e.preventDefault();
      duw(omhoog ? -160 : 160);
    });

    var lastW = document.documentElement.clientWidth;

    var stilTimer = null;
    function zetMerkStil() {
      now.style.transition = 'none'; neu.style.transition = 'none';
      zetMerk();
      void now.offsetWidth;
      clearTimeout(stilTimer);
      stilTimer = setTimeout(function () {
        now.style.transition = ''; neu.style.transition = '';
      }, 120);
    }

    var merkPoging = 0, merkTimer = null;
    function zetMerkGecontroleerd() {
      zetMerkStil();
      clearTimeout(merkTimer);
      merkTimer = setTimeout(function () {
        var mx = (L.mode === 'S') ? 34 : M;
        var mis = Math.abs(now.getBoundingClientRect().left - mx);
        if (mis > 1 && merkPoging < 8) { merkPoging++; zetMerkGecontroleerd(); }
        else merkPoging = 0;
      }, 80);
    }

    window.addEventListener('resize', function () {
      var w = document.documentElement.clientWidth;
      if (w === lastW) return;
      lastW = w;
      L = layout();
      if (played) zetMerkGecontroleerd();
    });
  </script>

</body>
